[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coletor"
version = "0.1.0"
description = "Coleta dados de sites respeitando robots.txt, limite de taxa e cache, e exporta para planilha."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Robert Miranda", email = "r.mirandaa@live.com" }]
keywords = ["scraping", "web scraping", "robots.txt", "csv", "cli"]
dependencies = ["beautifulsoup4>=4.12", "PyYAML>=6.0"]

[project.optional-dependencies]
rede = ["requests>=2.31"]
xlsx = ["openpyxl>=3.1"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "requests>=2.31", "openpyxl>=3.1"]

[project.scripts]
coletor = "coletor.cli:main"

[project.urls]
Repository = "https://github.com/robertfxbr/webscraper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["coletor"]
omit = ["*/__main__.py"]

[tool.coverage.report]
exclude_also = ["pragma: no cover", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
