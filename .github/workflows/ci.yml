name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar o pacote e as dependencias de desenvolvimento
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Formatacao
        run: ruff format --check .

      - name: Testes
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

      - name: Validar as configuracoes versionadas
        run: |
          for arquivo in configs/*.yaml; do
            coletor check "$arquivo"
          done
